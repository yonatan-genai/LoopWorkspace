# Fork addition. Sends one "[TEST]" Loop certificate alert with the real state report,
# to prove the failure email path works. Changes nothing.
name: 3c. Test Loop Certificate Alert
run-name: Test Loop Certificate Alert (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches: [targeted-cert-renewal]
    paths: [.github/workflows/test_cert_alert.yml]

jobs:
  test_alert:
    name: Send test alert
    runs-on: xcode-27
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install Project Dependencies
        run: bundle install

      - name: Report certificate state
        run: bundle exec fastlane loop_cert_state
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

      - name: Email test alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_HMAC_KEY: ${{ secrets.ALERT_HMAC_KEY }}
          ALERT_SEVERITY: info
          ALERT_TO: ${{ vars.CERT_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/loop_cert_alert.sh "[TEST] Loop certificate renewal failed" "TEST ONLY, nothing failed. This proves the failure email works; a real alert names the failed stage here (worker first, Resend fallback)."
